volumes:
  etc_wireguard:
services:
  vpn:
    image: ghcr.io/wg-easy/wg-easy:15
    container_name: vpn
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vpn.rule=Host(`vpn.dynatech.cloud`)"
      - "traefik.http.routers.vpn.entrypoints=websecure"
      - "traefik.http.routers.vpn.tls.certresolver=letsencrypt"
      - "traefik.http.services.vpn.loadbalancer.server.port=51821"
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - proxy
    volumes:
      - etc_wireguard:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    ports:
      - "51820:51820/udp"
      - "51821:51821/tcp"
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
networks:
  proxy:
    external: true