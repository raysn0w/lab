
services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped

    command: -H unix:///var/run/docker.sock

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/data

    networks:
      - proxy

    labels:
      - traefik.enable=true
      - traefik.http.routers.port.rule=Host(`port.${DOMAIN}`)
      - traefik.http.routers.port.entrypoints=websecure
      - traefik.http.routers.port.tls.certresolver=letsencrypt
      - traefik.http.services.port.loadbalancer.server.port=9000

networks:
  proxy:
    external: true
